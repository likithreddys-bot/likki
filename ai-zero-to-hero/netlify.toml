# Netlify settings for AI Zero to Hero.
# In Netlify set "Base directory" to ai-zero-to-hero (this repo also contains an unrelated static site at its root).
# Settings in this file take priority over the Netlify UI, so a wrong "Publish directory" there cannot break the deploy.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

# Run Netlify's Next.js runtime explicitly: it turns the server-rendered pages and middleware into Netlify functions.
# Without it the site is published as plain static files and every page shows Netlify's "Page not found".
[[plugins]]
  package = "@netlify/plugin-nextjs"
